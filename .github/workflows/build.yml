name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip kholo
        run: unzip -q MusicShare.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: cd MusicShare && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicShare-APK
          path: MusicShare/app/build/outputs/apk/debug/app-debug.apk
